<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kurage Motion Browser Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
  <style>
    :root {
      --paper: #f7fbf8;
      --mist: #ddf4f2;
      --ink: #143844;
      --cyan: #16afc4;
      --coral: #ff725e;
      --gold: #f6b73c;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
      background:
        radial-gradient(circle at 18% 16%, rgba(22, 175, 196, .18), transparent 28%),
        radial-gradient(circle at 84% 18%, rgba(246, 183, 60, .14), transparent 24%),
        linear-gradient(135deg, #ffffff 0%, var(--paper) 44%, #eafaf8 100%);
      overflow: auto;
    }
    .shell {
      display: grid;
      grid-template-columns: minmax(260px, 340px) minmax(420px, 1fr);
      gap: clamp(12px, 1.8vw, 20px);
      min-height: 100dvh;
      padding: clamp(10px, 1.8vw, 20px);
    }
    .panel {
      position: relative;
      z-index: 2;
      padding: clamp(14px, 2vw, 20px);
      border: 1px solid rgba(20, 56, 68, .10);
      border-radius: 24px;
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 18px 46px rgba(20, 56, 68, .11);
      backdrop-filter: blur(16px);
      align-self: stretch;
      overflow: auto;
    }
    .eyebrow {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 8px 0 10px;
      font-size: clamp(28px, 4.1vw, 48px);
      line-height: .94;
      letter-spacing: -.06em;
    }
    h1 span { color: var(--coral); }
    .lead {
      margin: 0 0 12px;
      color: #526b73;
      font-size: clamp(12px, 1.3vw, 14px);
      line-height: 1.65;
      font-weight: 700;
    }
    .buttons {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(20, 56, 68, .12);
      border-radius: 14px;
      color: var(--ink);
      background: var(--white);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    button:hover, button.active {
      transform: translateY(-1px);
      border-color: rgba(22, 175, 196, .65);
      box-shadow: 0 10px 22px rgba(22, 175, 196, .16);
    }
    button small {
      color: var(--cyan);
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .stage {
      position: relative;
      height: calc(100dvh - clamp(20px, 3.6vw, 40px));
      min-height: 420px;
      border-radius: 26px;
      border: 1px solid rgba(20, 56, 68, .08);
      background:
        linear-gradient(90deg, rgba(20, 56, 68, .05) 1px, transparent 1px),
        linear-gradient(0deg, rgba(20, 56, 68, .05) 1px, transparent 1px),
        rgba(255, 255, 255, .55);
      background-size: 58px 58px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.6), 0 22px 58px rgba(20, 56, 68, .11);
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      background: transparent;
    }
    .status {
      position: absolute;
      right: 14px;
      top: 14px;
      padding: 10px 13px;
      border-left: 5px solid var(--cyan);
      border-radius: 12px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 10px 24px rgba(20, 56, 68, .10);
      font-size: 13px;
      font-weight: 900;
    }
    .rule {
      width: 72px;
      height: 6px;
      margin: 14px 0;
      background: var(--cyan);
    }
    @media (max-height: 760px) and (min-width: 861px) {
      .shell { grid-template-columns: 300px minmax(420px, 1fr); }
      .panel { padding: 14px 16px; }
      h1 { font-size: clamp(28px, 3.6vw, 42px); }
      .lead { font-size: 12px; line-height: 1.55; }
      .rule { margin: 10px 0; }
      button { padding: 9px 11px; }
    }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; padding: 12px; }
      .stage { height: 62dvh; min-height: 420px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="eyebrow">Kurage Motion Lab</div>
      <h1>ブラウザで<br><span>動きを確認。</span></h1>
      <div class="rule"></div>
      <p class="lead">Text-To-VRMA系のモーション指定をKurageRigに焼き込み、GLBとしてブラウザ再生します。ボタンで「手を振る」「ジャンプ」「お辞儀」「リアクション」を切り替えできます。</p>
      <div class="buttons" id="buttons"></div>
    </section>
    <section class="stage">
      <div class="status" id="motionStatus">loading wave...</div>
      <model-viewer id="viewer"
        src="./assets/kurage-motion-wave.glb?v=20260715b"
        camera-controls
        autoplay
        animation-crossfade-duration="260"
        exposure="1.15"
        shadow-intensity="0.45"
        camera-orbit="0deg 75deg 8.8m"
        field-of-view="28deg"
        camera-target="0m 0.65m 0m">
      </model-viewer>
    </section>
  </main>
  <script>
    const motions = [
      { id: 'wave', label: '手を振る', note: 'wave' },
      { id: 'jump', label: 'ジャンプ', note: 'jump' },
      { id: 'bow', label: 'お辞儀', note: 'bow' },
      { id: 'reaction', label: 'リアクション', note: 'reaction' },
    ];
    const viewer = document.getElementById('viewer');
    const buttons = document.getElementById('buttons');
    const status = document.getElementById('motionStatus');

    function setMotion(id) {
      viewer.src = `./assets/kurage-motion-${id}.glb?v=20260715b`;
      status.textContent = `loading ${id}...`;
      for (const button of buttons.querySelectorAll('button')) {
        button.classList.toggle('active', button.dataset.motion === id);
      }
    }

    for (const motion of motions) {
      const button = document.createElement('button');
      button.dataset.motion = motion.id;
      button.innerHTML = `<span>${motion.label}</span><small>${motion.note}</small>`;
      button.addEventListener('click', () => setMotion(motion.id));
      buttons.appendChild(button);
    }
    buttons.querySelector('[data-motion="wave"]').classList.add('active');

    viewer.addEventListener('load', () => {
      const id = viewer.src.match(/kurage-motion-([a-z]+)\.glb/)?.[1] || 'motion';
      status.textContent = `playing ${id}`;
      const names = viewer.availableAnimations || [];
      if (names.length) viewer.animationName = names[0];
      viewer.play();
    });
    viewer.addEventListener('error', () => {
      status.textContent = 'model load error';
    });
  </script>
</body>
</html>
