<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kurage Motion Browser Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
  <style>
    :root {
      --paper: #f7fbf8;
      --mist: #ddf4f2;
      --ink: #143844;
      --cyan: #16afc4;
      --coral: #ff725e;
      --gold: #f6b73c;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
      background:
        radial-gradient(circle at 18% 16%, rgba(22, 175, 196, .18), transparent 28%),
        radial-gradient(circle at 84% 18%, rgba(246, 183, 60, .14), transparent 24%),
        linear-gradient(135deg, #ffffff 0%, var(--paper) 44%, #eafaf8 100%);
      overflow: hidden;
    }
    .shell {
      display: grid;
      grid-template-columns: minmax(280px, 420px) 1fr;
      gap: 24px;
      min-height: 100vh;
      padding: 30px;
    }
    .panel {
      position: relative;
      z-index: 2;
      align-self: stretch;
      padding: 28px;
      border: 1px solid rgba(20, 56, 68, .10);
      border-radius: 30px;
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 24px 70px rgba(20, 56, 68, .13);
      backdrop-filter: blur(16px);
    }
    .eyebrow {
      color: var(--cyan);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    h1 {
      margin: 12px 0 14px;
      font-size: clamp(34px, 5vw, 64px);
      line-height: .92;
      letter-spacing: -.06em;
    }
    h1 span { color: var(--coral); }
    .lead {
      margin: 0 0 22px;
      color: #526b73;
      font-size: 15px;
      line-height: 1.85;
      font-weight: 700;
    }
    .buttons {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }
    button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 15px 16px;
      border: 1px solid rgba(20, 56, 68, .12);
      border-radius: 18px;
      color: var(--ink);
      background: var(--white);
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    button:hover, button.active {
      transform: translateY(-2px);
      border-color: rgba(22, 175, 196, .65);
      box-shadow: 0 14px 32px rgba(22, 175, 196, .18);
    }
    button small {
      color: var(--cyan);
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .stage {
      position: relative;
      min-height: calc(100vh - 60px);
      border-radius: 34px;
      border: 1px solid rgba(20, 56, 68, .08);
      background:
        linear-gradient(90deg, rgba(20, 56, 68, .05) 1px, transparent 1px),
        linear-gradient(0deg, rgba(20, 56, 68, .05) 1px, transparent 1px),
        rgba(255, 255, 255, .55);
      background-size: 74px 74px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.6), 0 28px 80px rgba(20, 56, 68, .12);
    }
    model-viewer {
      width: 100%;
      height: calc(100vh - 60px);
      min-height: 620px;
      --poster-color: transparent;
      background: transparent;
    }
    .status {
      position: absolute;
      right: 20px;
      top: 20px;
      padding: 12px 16px;
      border-left: 6px solid var(--cyan);
      border-radius: 14px;
      background: rgba(255,255,255,.86);
      box-shadow: 0 12px 30px rgba(20, 56, 68, .10);
      font-weight: 900;
    }
    .rule {
      width: 92px;
      height: 7px;
      margin: 20px 0;
      background: var(--cyan);
    }
    @media (max-width: 860px) {
      body { overflow: auto; }
      .shell { grid-template-columns: 1fr; padding: 16px; }
      .stage, model-viewer { min-height: 560px; height: 62vh; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="eyebrow">Kurage Motion Lab</div>
      <h1>ブラウザで<br><span>動きを確認。</span></h1>
      <div class="rule"></div>
      <p class="lead">Text-To-VRMA系のモーション指定をKurageRigに焼き込み、GLBとしてブラウザ再生します。ボタンで「手を振る」「ジャンプ」「お辞儀」「リアクション」を切り替えできます。</p>
      <div class="buttons" id="buttons"></div>
    </section>
    <section class="stage">
      <div class="status" id="motionStatus">loading wave...</div>
      <model-viewer id="viewer"
        src="./assets/kurage-motion-wave.glb"
        camera-controls
        autoplay
        animation-crossfade-duration="260"
        exposure="1.15"
        shadow-intensity="0.45"
        camera-orbit="0deg 75deg 7.0m"
        field-of-view="32deg"
        camera-target="0m 0.65m 0m">
      </model-viewer>
    </section>
  </main>
  <script>
    const motions = [
      { id: 'wave', label: '手を振る', note: 'wave' },
      { id: 'jump', label: 'ジャンプ', note: 'jump' },
      { id: 'bow', label: 'お辞儀', note: 'bow' },
      { id: 'reaction', label: 'リアクション', note: 'reaction' },
    ];
    const viewer = document.getElementById('viewer');
    const buttons = document.getElementById('buttons');
    const status = document.getElementById('motionStatus');

    function setMotion(id) {
      viewer.src = `./assets/kurage-motion-${id}.glb`;
      status.textContent = `loading ${id}...`;
      for (const button of buttons.querySelectorAll('button')) {
        button.classList.toggle('active', button.dataset.motion === id);
      }
    }

    for (const motion of motions) {
      const button = document.createElement('button');
      button.dataset.motion = motion.id;
      button.innerHTML = `<span>${motion.label}</span><small>${motion.note}</small>`;
      button.addEventListener('click', () => setMotion(motion.id));
      buttons.appendChild(button);
    }
    buttons.querySelector('[data-motion="wave"]').classList.add('active');

    viewer.addEventListener('load', () => {
      const id = viewer.src.match(/kurage-motion-([a-z]+)\.glb/)?.[1] || 'motion';
      status.textContent = `playing ${id}`;
      const names = viewer.availableAnimations || [];
      if (names.length) viewer.animationName = names[0];
      viewer.play();
    });
    viewer.addEventListener('error', () => {
      status.textContent = 'model load error';
    });
  </script>
</body>
</html>
