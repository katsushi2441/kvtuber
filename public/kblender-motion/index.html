<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kurage Motion Browser Viewer</title>
  <style>
    :root { --paper:#f7fbf8; --ink:#143844; --cyan:#16afc4; --coral:#ff725e; --white:#fff; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; }
    body {
      color:var(--ink); font-family:"Noto Sans JP","Hiragino Sans",sans-serif; overflow:auto;
      background: radial-gradient(circle at 18% 16%, rgba(22,175,196,.18), transparent 28%), radial-gradient(circle at 84% 18%, rgba(246,183,60,.14), transparent 24%), linear-gradient(135deg,#fff 0%,var(--paper) 44%,#eafaf8 100%);
    }
    .shell { display:grid; grid-template-columns:minmax(260px,340px) minmax(420px,1fr); gap:clamp(12px,1.8vw,20px); min-height:100dvh; padding:clamp(10px,1.8vw,20px); }
    .panel { position:relative; z-index:2; padding:clamp(14px,2vw,20px); border:1px solid rgba(20,56,68,.10); border-radius:24px; background:rgba(255,255,255,.84); box-shadow:0 18px 46px rgba(20,56,68,.11); backdrop-filter:blur(16px); overflow:auto; }
    .eyebrow { color:var(--cyan); font-size:11px; font-weight:900; letter-spacing:.22em; text-transform:uppercase; }
    h1 { margin:8px 0 10px; font-size:clamp(28px,4.1vw,48px); line-height:.94; letter-spacing:-.06em; }
    h1 span { color:var(--coral); }
    .rule { width:72px; height:6px; margin:14px 0; background:var(--cyan); }
    .lead { margin:0 0 12px; color:#526b73; font-size:clamp(12px,1.3vw,14px); line-height:1.65; font-weight:700; }
    .buttons { display:grid; gap:8px; margin-top:12px; }
    button { display:flex; align-items:center; justify-content:space-between; width:100%; padding:10px 12px; border:1px solid rgba(20,56,68,.12); border-radius:14px; color:var(--ink); background:var(--white); font-size:14px; font-weight:900; cursor:pointer; transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease; }
    button:hover, button.active { transform:translateY(-1px); border-color:rgba(22,175,196,.65); box-shadow:0 10px 22px rgba(22,175,196,.16); }
    button small { color:var(--cyan); font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
    .stage { position:relative; height:calc(100dvh - clamp(20px,3.6vw,40px)); min-height:420px; border-radius:26px; border:1px solid rgba(20,56,68,.08); background:linear-gradient(90deg,rgba(20,56,68,.05) 1px,transparent 1px),linear-gradient(0deg,rgba(20,56,68,.05) 1px,transparent 1px),rgba(255,255,255,.55); background-size:58px 58px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 22px 58px rgba(20,56,68,.11); }
    canvas { display:block; width:100%; height:100%; }
    .status { position:absolute; right:14px; top:14px; padding:10px 13px; border-left:5px solid var(--cyan); border-radius:12px; background:rgba(255,255,255,.88); box-shadow:0 10px 24px rgba(20,56,68,.10); font-size:13px; font-weight:900; }
    .note { margin-top:12px; padding:10px 12px; border-radius:14px; background:#f1fbfb; color:#44616a; font-size:12px; line-height:1.55; font-weight:700; }
    @media (max-height:760px) and (min-width:861px) { .shell{grid-template-columns:300px minmax(420px,1fr);} .panel{padding:14px 16px;} h1{font-size:clamp(28px,3.6vw,42px);} .lead{font-size:12px;line-height:1.55;} .rule{margin:10px 0;} button{padding:9px 11px;} .note{display:none;} }
    @media (max-width:860px) { .shell{grid-template-columns:1fr;padding:12px;} .stage{height:62dvh;min-height:420px;} }
  </style>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="eyebrow">Kurage Motion Lab</div>
      <h1>ブラウザで<br><span>動きを確認。</span></h1>
      <div class="rule"></div>
      <p class="lead">元のKurageさん3Dモデルを使い、ブラウザ上で腕の動きも確認できるようにしました。ボタンで「手を振る」「ジャンプ」「お辞儀」「リアクション」を切り替えできます。</p>
      <div class="buttons" id="buttons"></div>
      <div class="note">全体の揺れだけでなく、腕の動きも見えるブラウザプレビューです。</div>
    </section>
    <section class="stage">
      <div class="status" id="motionStatus">loading model...</div>
      <canvas id="stageCanvas"></canvas>
    </section>
  </main>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://unpkg.com/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

    const motions = [
      { id:'wave', label:'手を振る', note:'wave' },
      { id:'jump', label:'ジャンプ', note:'jump' },
      { id:'bow', label:'お辞儀', note:'bow' },
      { id:'reaction', label:'リアクション', note:'reaction' },
    ];
    const buttons = document.getElementById('buttons');
    const status = document.getElementById('motionStatus');
    const canvas = document.getElementById('stageCanvas');
    let activeMotion = 'wave';
    let motionStart = performance.now();
    let avatar = null;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xf7fbf8, 8, 18);
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    camera.position.set(0, 1.28, 6.2);
    camera.lookAt(0, 1.0, 0);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, preserveDrawingBuffer:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    scene.add(new THREE.HemisphereLight(0xffffff, 0xe9fbff, 3.1));
    const key = new THREE.DirectionalLight(0xffffff, 3.0);
    key.position.set(-3.5, 5.2, 5.0); key.castShadow = true; scene.add(key);
    const fill = new THREE.DirectionalLight(0xeaffff, 1.8);
    fill.position.set(4, 2, 3); scene.add(fill);
    const front = new THREE.DirectionalLight(0xffffff, 1.2);
    front.position.set(0, 2.5, 5); scene.add(front);

    const shadowMat = new THREE.ShadowMaterial({ color:0x143844, opacity:.13 });
    const floor = new THREE.Mesh(new THREE.CircleGeometry(1.25, 72), shadowMat);
    floor.position.y = .01; floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

    const modelRoot = new THREE.Group();
    scene.add(modelRoot);

    const loader = new GLTFLoader();
    loader.load('/previews/kurage-hunyuan3d-mv-textured.glb?v=proxy-arm-20260715', (gltf) => {
      const model = gltf.scene;
      model.traverse((o) => {
        if (!o.isMesh) return;
        o.castShadow = true;
        o.receiveShadow = true;
        if (!o.material) return;
        if ('roughness' in o.material) o.material.roughness = Math.min(0.72, o.material.roughness ?? 0.55);
        if ('metalness' in o.material) o.material.metalness = 0;
        if ('emissive' in o.material) {
          o.material.emissive = new THREE.Color(0xffffff);
          o.material.emissiveIntensity = 0.03;
        }
        o.material.needsUpdate = true;
      });
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size); box.getCenter(center);
      model.position.sub(center);
      model.scale.setScalar(2.65 / Math.max(size.x, size.y, size.z));
      model.position.y += 1.16;
      modelRoot.add(model);
      avatar = modelRoot;
      setMotion(activeMotion);
    }, undefined, (err) => {
      console.error(err);
      status.textContent = 'model load failed';
    });

    const armMat = new THREE.MeshStandardMaterial({ color:0xffe5d4, roughness:.5, metalness:0, transparent:true, opacity:.96 });
    const cuffMat = new THREE.MeshStandardMaterial({ color:0xdffcff, roughness:.35, metalness:0, transparent:true, opacity:.86 });
    const accentMat = new THREE.MeshStandardMaterial({ color:0x18c5d7, roughness:.32, metalness:.02 });
    function part(geo, mat, parent, pos=[0,0,0], rot=[0,0,0], scale=[1,1,1]) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(...pos); m.rotation.set(...rot); m.scale.set(...scale);
      m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
    }
    function makeArm(side) {
      const root = new THREE.Group();
      root.position.set(side * .46, 1.36, .58);
      const upper = new THREE.Group(); root.add(upper);
      part(new THREE.CapsuleGeometry(.052, .30, 8, 18), armMat, upper, [0, -.20, 0], [0,0,0], [1,1,1]);
      part(new THREE.SphereGeometry(.082, 18, 12), cuffMat, upper, [0, .02, 0], [0,0,0], [1.25,.75,1]);
      const lower = new THREE.Group(); lower.position.set(0, -.38, 0); upper.add(lower);
      part(new THREE.CapsuleGeometry(.048, .30, 8, 18), armMat, lower, [0, -.18, 0]);
      part(new THREE.SphereGeometry(.075, 18, 12), armMat, lower, [0, -.38, .015], [0,0,0], [1.1,.9,1]);
      root.userData.upper = upper;
      root.userData.lower = lower;
      root.userData.side = side;
      scene.add(root);
      return root;
    }
    const leftArm = makeArm(-1);
    const rightArm = makeArm(1);

    const waveMarks = new THREE.Group();
    for (let i=0;i<3;i++) {
      const ring = part(new THREE.TorusGeometry(.10 + i*.055, .006, 8, 32), accentMat, waveMarks, [.68 + i*.12, 1.55 + i*.10, .60], [1.0, .25, .45]);
      ring.material = accentMat;
    }
    scene.add(waveMarks);

    function resetProxy() {
      if (avatar) {
        avatar.position.set(0,0,0); avatar.rotation.set(0,0,0); avatar.scale.set(1,1,1);
      }
      leftArm.visible = rightArm.visible = true;
      waveMarks.visible = false;
      leftArm.position.set(-.34, 1.40, .56);
      rightArm.position.set(.34, 1.40, .56);
      leftArm.rotation.set(0,0,-.24);
      rightArm.rotation.set(0,0,.24);
      leftArm.userData.upper.rotation.set(.05,0,0);
      rightArm.userData.upper.rotation.set(.05,0,0);
      leftArm.userData.lower.rotation.set(0,0,-.05);
      rightArm.userData.lower.rotation.set(0,0,.05);
      floor.scale.set(1,1,1);
    }

    function animateProxy(t) {
      resetProxy();
      const s = Math.sin, c = Math.cos;
      if (activeMotion === 'wave') {
        if (avatar) { avatar.rotation.y = -.10 + .04*s(t*2.0); avatar.position.y = .025*s(t*3.8); }
        rightArm.rotation.z = 1.72 + .24*s(t*7.8);
        rightArm.rotation.x = -.08;
        rightArm.userData.lower.rotation.z = .34 + .24*s(t*10.5);
        rightArm.position.y += .05*s(t*4.0);
        leftArm.rotation.z = -.26 + .035*s(t*3.0);
        waveMarks.visible = true;
        waveMarks.rotation.z = .08*s(t*5.0);
      } else if (activeMotion === 'jump') {
        const hop = Math.max(0, s(t*5.2));
        if (avatar) { avatar.position.y = hop*.34; avatar.scale.y = 1 - (1-hop)*.025; }
        leftArm.rotation.z = -.55 - .16*hop;
        rightArm.rotation.z = .55 + .16*hop;
        leftArm.userData.lower.rotation.z = -.12 - .06*hop;
        rightArm.userData.lower.rotation.z = .12 + .06*hop;
        leftArm.position.y += hop*.18; rightArm.position.y += hop*.18;
        floor.scale.set(1 + hop*.22, 1 + hop*.22, 1);
      } else if (activeMotion === 'bow') {
        const phase = (t % 2.8) / 2.8;
        const b = phase < .42 ? (1 - c((phase/.42)*Math.PI))*.5 : phase < .70 ? 1 : Math.max(0, 1 - ((phase-.70)/.30));
        if (avatar) { avatar.rotation.x = .34*b; avatar.position.y = -.05*b; }
        leftArm.rotation.z = -.24 - .10*b;
        rightArm.rotation.z = .24 + .10*b;
      } else if (activeMotion === 'reaction') {
        const pop = Math.max(0, s(t*5.8));
        if (avatar) { avatar.position.y = .08*pop; avatar.rotation.y = .17*s(t*5.0); avatar.scale.setScalar(1 + .025*pop); }
        leftArm.rotation.z = -.40 - .22*pop;
        rightArm.rotation.z = .40 + .22*pop;
        leftArm.userData.lower.rotation.z = -.18*pop;
        rightArm.userData.lower.rotation.z = .18*pop;
      }
    }

    function setMotion(id) {
      activeMotion = id;
      motionStart = performance.now();
      status.textContent = avatar ? `playing ${id} / moving arms` : 'loading model...';
      buttons.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.motion === id));
    }

    function resize() {
      const r = canvas.parentElement.getBoundingClientRect();
      renderer.setSize(r.width, r.height, false);
      camera.aspect = r.width / r.height;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(canvas.parentElement);

    for (const motion of motions) {
      const button = document.createElement('button');
      button.dataset.motion = motion.id;
      button.innerHTML = `<span>${motion.label}</span><small>${motion.note}</small>`;
      button.addEventListener('click', () => setMotion(motion.id));
      buttons.appendChild(button);
    }
    setMotion('wave');

    function tick(now) {
      animateProxy((now - motionStart) / 1000);
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
