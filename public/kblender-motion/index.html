<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kurage Motion Browser Viewer</title>
  <style>
    :root { --paper:#f7fbf8; --ink:#143844; --cyan:#16afc4; --coral:#ff725e; --white:#fff; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; }
    body {
      color:var(--ink); font-family:"Noto Sans JP","Hiragino Sans",sans-serif; overflow:auto;
      background: radial-gradient(circle at 18% 16%, rgba(22,175,196,.18), transparent 28%), radial-gradient(circle at 84% 18%, rgba(246,183,60,.14), transparent 24%), linear-gradient(135deg,#fff 0%,var(--paper) 44%,#eafaf8 100%);
    }
    .shell { display:grid; grid-template-columns:minmax(260px,340px) minmax(420px,1fr); gap:clamp(12px,1.8vw,20px); min-height:100dvh; padding:clamp(10px,1.8vw,20px); }
    .panel { position:relative; z-index:2; padding:clamp(14px,2vw,20px); border:1px solid rgba(20,56,68,.10); border-radius:24px; background:rgba(255,255,255,.84); box-shadow:0 18px 46px rgba(20,56,68,.11); backdrop-filter:blur(16px); overflow:auto; }
    .eyebrow { color:var(--cyan); font-size:11px; font-weight:900; letter-spacing:.22em; text-transform:uppercase; }
    h1 { margin:8px 0 10px; font-size:clamp(28px,4.1vw,48px); line-height:.94; letter-spacing:-.06em; }
    h1 span { color:var(--coral); }
    .rule { width:72px; height:6px; margin:14px 0; background:var(--cyan); }
    .lead { margin:0 0 12px; color:#526b73; font-size:clamp(12px,1.3vw,14px); line-height:1.65; font-weight:700; }
    .buttons { display:grid; gap:8px; margin-top:12px; }
    button { display:flex; align-items:center; justify-content:space-between; width:100%; padding:10px 12px; border:1px solid rgba(20,56,68,.12); border-radius:14px; color:var(--ink); background:var(--white); font-size:14px; font-weight:900; cursor:pointer; transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease; }
    button:hover, button.active { transform:translateY(-1px); border-color:rgba(22,175,196,.65); box-shadow:0 10px 22px rgba(22,175,196,.16); }
    button small { color:var(--cyan); font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
    .stage { position:relative; height:calc(100dvh - clamp(20px,3.6vw,40px)); min-height:420px; border-radius:26px; border:1px solid rgba(20,56,68,.08); background:linear-gradient(90deg,rgba(20,56,68,.05) 1px,transparent 1px),linear-gradient(0deg,rgba(20,56,68,.05) 1px,transparent 1px),rgba(255,255,255,.55); background-size:58px 58px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 22px 58px rgba(20,56,68,.11); }
    canvas { display:block; width:100%; height:100%; }
    .status { position:absolute; right:14px; top:14px; padding:10px 13px; border-left:5px solid var(--cyan); border-radius:12px; background:rgba(255,255,255,.88); box-shadow:0 10px 24px rgba(20,56,68,.10); font-size:13px; font-weight:900; }
    .note { margin-top:12px; padding:10px 12px; border-radius:14px; background:#f1fbfb; color:#44616a; font-size:12px; line-height:1.55; font-weight:700; }
    @media (max-height:760px) and (min-width:861px) { .shell{grid-template-columns:300px minmax(420px,1fr);} .panel{padding:14px 16px;} h1{font-size:clamp(28px,3.6vw,42px);} .lead{font-size:12px;line-height:1.55;} .rule{margin:10px 0;} button{padding:9px 11px;} .note{display:none;} }
    @media (max-width:860px) { .shell{grid-template-columns:1fr;padding:12px;} .stage{height:62dvh;min-height:420px;} }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="eyebrow">Kurage Motion Lab</div>
      <h1>ブラウザで<br><span>動きを確認。</span></h1>
      <div class="rule"></div>
      <p class="lead">関節ごとに分けたKurageさん3Dを、ブラウザ上で軽快に動かします。ボタンで「手を振る」「ジャンプ」「お辞儀」「リアクション」を切り替えできます。</p>
      <div class="buttons" id="buttons"></div>
      <div class="note">ノートPC画面でも全ボタンが収まる、Kurage Motion Labのブラウザプレビューです。</div>
    </section>
    <section class="stage">
      <div class="status" id="motionStatus">loading...</div>
      <canvas id="stageCanvas"></canvas>
    </section>
  </main>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.180.0/build/three.module.js';

    const motions = [
      { id:'wave', label:'手を振る', note:'wave' },
      { id:'jump', label:'ジャンプ', note:'jump' },
      { id:'bow', label:'お辞儀', note:'bow' },
      { id:'reaction', label:'リアクション', note:'reaction' },
    ];
    const buttons = document.getElementById('buttons');
    const status = document.getElementById('motionStatus');
    const canvas = document.getElementById('stageCanvas');
    let currentMotion = 'wave';
    let motionStart = performance.now();

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xf7fbf8, 8, 16);
    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
    camera.position.set(0, 1.55, 7.2);
    camera.lookAt(0, 1.05, 0);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    scene.add(new THREE.HemisphereLight(0xffffff, 0xd9f5f2, 2.8));
    const key = new THREE.DirectionalLight(0xffffff, 2.4);
    key.position.set(-3, 5, 5); key.castShadow = true; scene.add(key);
    const rim = new THREE.DirectionalLight(0x83f2ff, 1.1);
    rim.position.set(4, 3, -2); scene.add(rim);

    const mat = {
      skin: new THREE.MeshStandardMaterial({ color:0xffd4b8, roughness:.55, metalness:0 }),
      dress: new THREE.MeshStandardMaterial({ color:0xf8ffff, roughness:.48, metalness:0 }),
      cyan: new THREE.MeshStandardMaterial({ color:0x12c7d8, roughness:.34, metalness:.02 }),
      blue: new THREE.MeshStandardMaterial({ color:0x63b8ff, roughness:.42, metalness:0 }),
      skirt: new THREE.MeshStandardMaterial({ color:0xdffcff, roughness:.35, metalness:0, transparent:true, opacity:.92 }),
      coral: new THREE.MeshStandardMaterial({ color:0xff725e, roughness:.5, metalness:0 }),
      hair: new THREE.MeshStandardMaterial({ color:0xf0fbff, roughness:.6, metalness:0 }),
      eye: new THREE.MeshStandardMaterial({ color:0x102f45, roughness:.35, metalness:0 }),
      sole: new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.5, metalness:0 }),
      shadow: new THREE.ShadowMaterial({ color:0x143844, opacity:.12 }),
    };

    function mesh(geo, material, parent, pos=[0,0,0], rot=[0,0,0], scale=[1,1,1]) {
      const o = new THREE.Mesh(geo, material); o.position.set(...pos); o.rotation.set(...rot); o.scale.set(...scale); o.castShadow = true; o.receiveShadow = true; parent.add(o); return o;
    }
    function limb(length, radius, material) {
      const g = new THREE.Group();
      const cyl = mesh(new THREE.CylinderGeometry(radius, radius*.9, length, 18), material, g, [0, -length/2, 0]);
      mesh(new THREE.SphereGeometry(radius, 18, 12), material, g, [0, 0, 0]);
      mesh(new THREE.SphereGeometry(radius*.9, 18, 12), material, g, [0, -length, 0]);
      return g;
    }

    const root = new THREE.Group(); scene.add(root);
    const body = new THREE.Group(); root.add(body);
    mesh(new THREE.CapsuleGeometry(.34, .68, 12, 28), mat.dress, body, [0, 1.10, 0], [0,0,0], [1.02,1,0.88]);
    mesh(new THREE.ConeGeometry(.58, .54, 48, 1, true), mat.skirt, body, [0, .72, 0], [0,0,0], [1,1,.88]);
    mesh(new THREE.TorusGeometry(.47, .03, 12, 64), mat.cyan, body, [0, .97, 0], [Math.PI/2,0,0], [1,.74,1]);
    mesh(new THREE.SphereGeometry(.105, 24, 16), mat.coral, body, [-.08, 1.38, .31], [0,0,.65], [1.18,.74,.36]);
    mesh(new THREE.SphereGeometry(.105, 24, 16), mat.coral, body, [.08, 1.38, .31], [0,0,-.65], [1.18,.74,.36]);

    const head = new THREE.Group(); root.add(head); head.position.set(0, 1.91, 0);
    mesh(new THREE.SphereGeometry(.40, 48, 32), mat.skin, head, [0, 0, 0], [0,0,0], [1.0, .98, .92]);
    mesh(new THREE.SphereGeometry(.43, 48, 24, 0, Math.PI*2, 0, Math.PI*.54), mat.blue, head, [0, .18, 0], [0,0,0], [1.08,.70,1.02]);
    for (let i=0;i<7;i++) {
      const x = (i-3)*.135;
      mesh(new THREE.SphereGeometry(.095, 20, 12), mat.blue, head, [x, .035, .34], [0,0,0], [1.18,.74,.68]);
    }
    mesh(new THREE.SphereGeometry(.18, 28, 18), mat.hair, head, [-.38, -.04, -.02], [0,0,.1], [.56,1.3,.62]);
    mesh(new THREE.SphereGeometry(.18, 28, 18), mat.hair, head, [.38, -.04, -.02], [0,0,-.1], [.56,1.3,.62]);
    mesh(new THREE.SphereGeometry(.075, 24, 12), mat.eye, head, [-.15, -.03, .36], [0,0,0], [1,.72,.22]);
    mesh(new THREE.SphereGeometry(.075, 24, 12), mat.eye, head, [.15, -.03, .36], [0,0,0], [1,.72,.22]);
    mesh(new THREE.SphereGeometry(.02, 12, 8), mat.coral, head, [0, -.18, .39], [0,0,0], [1.6,.45,.25]);

    const leftArm = limb(.64, .065, mat.skin); leftArm.position.set(-.40, 1.36, .08); body.add(leftArm);
    const rightArm = limb(.64, .065, mat.skin); rightArm.position.set(.40, 1.36, .08); body.add(rightArm);
    const leftLeg = limb(.60, .075, mat.skin); leftLeg.position.set(-.16, .62, .02); body.add(leftLeg);
    const rightLeg = limb(.60, .075, mat.skin); rightLeg.position.set(.16, .62, .02); body.add(rightLeg);
    mesh(new THREE.CapsuleGeometry(.105, .18, 8, 16), mat.sole, body, [-.19, .02, .04], [Math.PI/2,0,0]);
    mesh(new THREE.CapsuleGeometry(.105, .18, 8, 16), mat.sole, body, [.19, .02, .04], [Math.PI/2,0,0]);

    const tentacles = new THREE.Group(); body.add(tentacles);
    for (const side of [-1,1]) for (let i=0;i<2;i++) {
      const t = limb(.9 - i*.08, .045, mat.blue);
      t.position.set(side*(.22+i*.13), 1.12, -.34); t.rotation.set(.35, side*.12, side*(.18+i*.12)); tentacles.add(t);
    }
    const floor = mesh(new THREE.CircleGeometry(1.05, 64), mat.shadow, scene, [0,.01,0], [-Math.PI/2,0,0]); floor.receiveShadow = true;

    function resetPose() {
      root.position.set(0, 0, 0); root.rotation.set(0, 0, 0); root.scale.set(1,1,1);
      body.rotation.set(0,0,0); head.rotation.set(0,0,0);
      leftArm.rotation.set(.10,0,.36); rightArm.rotation.set(.10,0,-.36);
      leftLeg.rotation.set(0,0,.05); rightLeg.rotation.set(0,0,-.05);
      tentacles.children.forEach((t, i) => t.rotation.z += Math.sin(performance.now()/700+i)*.002);
    }
    function animatePose(t) {
      resetPose();
      const s = Math.sin, c = Math.cos;
      if (currentMotion === 'wave') {
        root.position.y = .035*s(t*4.4);
        head.rotation.y = -.18 + .04*s(t*2.6);
        rightArm.rotation.z = -1.45 + .34*s(t*9.2);
        rightArm.rotation.x = -.34;
        body.rotation.z = .035*s(t*3.2);
      } else if (currentMotion === 'jump') {
        const hop = Math.max(0, s(t*5.1));
        root.position.y = hop*.34;
        root.scale.y = 1 - (1-hop)*.04;
        leftArm.rotation.z = .75*hop + .16; rightArm.rotation.z = -.75*hop - .16;
        leftLeg.rotation.x = -.35*(1-hop); rightLeg.rotation.x = -.35*(1-hop);
        head.rotation.x = -.12*hop;
      } else if (currentMotion === 'bow') {
        const b = (1 - c(Math.min(1, (t%2.8)/1.15)*Math.PI))*.5;
        body.rotation.x = .46*b;
        head.rotation.x = .28*b;
        root.position.y = -.04*b;
      } else if (currentMotion === 'reaction') {
        const pop = Math.max(0, s(t*5.7));
        root.position.y = .08*pop;
        head.rotation.y = .18*s(t*5.2); head.rotation.x = -.12*pop;
        leftArm.rotation.z = .42 + .16*pop; rightArm.rotation.z = -.42 - .16*pop;
        body.rotation.z = .04*s(t*4.4);
      }
    }

    function resize() {
      const r = canvas.parentElement.getBoundingClientRect();
      renderer.setSize(r.width, r.height, false); camera.aspect = r.width/r.height; camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(canvas.parentElement);

    function setMotion(id) {
      currentMotion = id; motionStart = performance.now(); status.textContent = `playing ${id}`;
      buttons.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.motion === id));
    }
    for (const motion of motions) {
      const button = document.createElement('button'); button.dataset.motion = motion.id;
      button.innerHTML = `<span>${motion.label}</span><small>${motion.note}</small>`;
      button.addEventListener('click', () => setMotion(motion.id)); buttons.appendChild(button);
    }
    setMotion('wave');
    function tick(now) { animatePose((now-motionStart)/1000); renderer.render(scene, camera); requestAnimationFrame(tick); }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
